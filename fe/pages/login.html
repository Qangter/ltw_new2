<div class="login-wrap">
  <form class="login-card" id="lf">
    <div class="login-brand" aria-hidden="true">🎓</div>
    <p class="eyebrow">CỔNG HỌC VỤ</p>
    <h1>Tra cứu kết quả thi</h1>
    <p class="login-subtitle">Đăng nhập để tiếp tục</p>
    <div class="login-fields">
      <div class="login-field">
        <label for="login-username">Tên đăng nhập</label>
        <input id="login-username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="login-field">
        <label for="login-password">Mật khẩu</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
    </div>
    <button class="login-submit" type="submit">Đăng nhập</button>
    <div class="demo"><b>Tài khoản demo</b><span>Admin: admin / admin123</span><span>Giáo viên: teacher01 / teacher123</span><span>Sinh viên: student001 / student123</span></div>
  </form>
</div>
